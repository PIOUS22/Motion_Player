name: motion_player
description: Motion Player - modern Android video & audio player
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_riverpod: ^2.5.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.6
  photo_manager: ^3.2.0
  permission_handler: ^11.3.1
  file_picker: ^13.0.0
  screen_brightness: ^1.0.1
  volume_controller: ^3.6.0
  floating: ^6.0.0
  local_auth: ^2.2.0
  flutter_secure_storage: ^11.0.0
  encrypt: ^5.0.3
  path_provider: ^2.1.3
  wakelock_plus: ^1.3.0
  audio_service: ^0.18.15
  http: ^1.2.1
  package_info_plus: ^10.2.2
  background_downloader: ^8.6.0
  open_filex: ^4.5.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.3.2
flutter:
  uses-material-design: true
