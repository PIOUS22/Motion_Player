name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']          # tag v1.1.0 => signed APK + AAB, GitHub Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Create Android scaffold
        run: |
          if [ ! -d android/gradle ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
            flutter create --platforms=android --project-name motion_player --org com.motionplayer .
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Firebase config (optional secret)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; fi

      - name: Signing key (optional secret)
        env: { KS: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Patch gradle
        run: |
          python3 tools/patch_gradle.py
          # Old plugins mix Java 11 / Kotlin 1.8: warn instead of failing (set project-level AND user-level)
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=warning" >> ~/.gradle/gradle.properties
          grep -q "kotlin.jvm.target.validation.mode" android/gradle.properties || echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          echo "---- android/gradle.properties ----"; cat android/gradle.properties

      - run: flutter pub get

      - name: Build
        run: |
          ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ARGS="--build-name=${GITHUB_REF_NAME#v} --build-number=${GITHUB_RUN_NUMBER}"; fi
          flutter build apk --release --split-per-abi $ARGS
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then flutter build appbundle --release $ARGS; fi

      - uses: actions/upload-artifact@v4
        with:
          name: motion-player-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
