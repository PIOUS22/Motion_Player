name: Build APK
on:
  push: {tags: ['v*']}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      # Generates the android/ scaffold (gradle, MainActivity, icons) around our manifest
      - run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/m.xml
          flutter create . --org com.motionplayer --project-name motion_player --platforms android
          cp /tmp/m.xml android/app/src/main/AndroidManifest.xml
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
      # Force old plugins (e.g. screen_brightness_android) to compile against a newer SDK
      - run: |
          F=android/build.gradle.kts
          if [ -f "$F" ]; then
            { cat <<'KTS'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext is com.android.build.gradle.BaseExtension) { ext.compileSdkVersion(35) }
              }
          }
          KTS
            cat "$F"; } > /tmp/b.kts && mv /tmp/b.kts "$F"
          else
            F=android/build.gradle
            { cat <<'GRV'
          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) { p.android.compileSdkVersion 35 }
              }
          }
          GRV
            cat "$F"; } > /tmp/b.gradle && mv /tmp/b.gradle "$F"
          fi
      - run: |
          D=android/app/src/main/kotlin/com/motionplayer/motion_player
          mkdir -p $D && cp native/MainActivity.kt $D/MainActivity.kt
          find android/app/src/main -name MainActivity.* -not -path "$D/*" -delete
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: build/app/outputs/flutter-apk/app-release.apk}
      - uses: actions/upload-artifact@v4
        with: {name: motion-player-apk, path: build/app/outputs/flutter-apk/app-release.apk}
