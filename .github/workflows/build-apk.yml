name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android project, but keep our own manifest
      - name: Create Android scaffold
        run: |
          if [ ! -d android/gradle ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
            flutter create --platforms=android --project-name motion_player --org com.motionplayer .
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          # media_kit / audio_service need minSdk 24
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: motion-player-apk
          path: build/app/outputs/flutter-apk/*.apk
