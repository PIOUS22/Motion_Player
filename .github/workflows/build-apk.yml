name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.motionplayer --project-name motion_player .

      - name: Apply Android settings
        run: ./tools/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Build release APKs (per ABI + universal)
        run: |
          flutter build apk --release --split-per-abi --no-shrink
          flutter build apk --release --no-shrink
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/motion_player-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: motion-player-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
